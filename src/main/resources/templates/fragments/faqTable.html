<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>FAQ Fragment</title>
</head>
<body>
<div id="faqTableDiv" th:fragment="faqContent">
  <table class="table">
    <thead>
    <tr>
      <th style="width:20%;">NO</th>
      <th style="width:15%;">카테고리</th>
      <th style="width:65%;">제목</th>
      <th th:if="${id != null} and ${manager} == 'Y'">수정</th>
      <th th:if="${id != null} and ${manager} == 'Y'">삭제</th>
    </tr>
    </thead>
    <tbody id="faqRows">
    <th:block th:each="tmp, iterStat : ${list}">
      <tr class="question" th:data-num="${tmp.num}">
        <td th:text="${iterStat.index + 1}"></td>
        <td th:switch="${tmp.category}">
          <span th:case="'service'">[서비스 이용]</span>
          <span th:case="'order'">[주문·결제·배송]</span>
          <span th:case="'member'">[회원정보]</span>
          <span th:case="'etc'">[기타]</span>
        </td>
        <td>
          <span th:text="${tmp.title}"></span>
          <i class="bi bi-chevron-down" style="float:right"></i>
        </td>
        <td th:if="${id != null} and ${manager} == 'Y'"><a class="btn btn-outline-white" th:href="@{/Faq/FaqUpdateForm(num=${tmp.num})}"><i class="bi bi-pencil-fill"></i><span class="blind">수정</span></a></td>
        <td th:if="${id != null} and ${manager} == 'Y'"><a class="btn btn-outline-white" th:href="@{/Faq/FaqDelete(num=${tmp.num})}" onclick="return confirm('정말 삭제하시겠습니까?');"><i class="bi bi-x-circle-fill"></i><span class="blind">삭제</span></a></td>
      </tr>
      <tr class="answer d-none" th:id="'answer' + ${tmp.num}">
        <td colspan="5">
          <div style="text-align:left; margin-left:10%;" th:utext="${tmp.content}"></div>
        </td>
      </tr>
    </th:block>
    </tbody>
  </table>

  <button class="btn btn-outline-dark" style="float:right" th:if="${manager} == 'Y'"
          th:onclick="|location.href='@{/Faq/FaqInsertForm}'|">글쓰기</button>

  <div class="page-ui clearfix" style="display:flex; justify-content:center;"
       th:if="${hasResult}">
    <ul class="pagination">
      <li class="page-item" th:if="${startPageNum > 1}">
        <a class="page-link"
           th:attr="data-page=${startPageNum - 1}"
           href="javascript:void(0)">Prev</a>
      </li>

      <li class="page-item" th:each="i : ${pageNumbers}">
        <a class="page-link"
           th:classappend="${pageNum == i} ? ' active'"
           th:attr="data-page=${i}"
           href="javascript:void(0)"
           th:text="${i}"></a>
      </li>

      <li class="page-item" th:if="${endPageNum < totalPageCount}">
        <a class="page-link"
           th:attr="data-page=${endPageNum + 1}"
           href="javascript:void(0)">Next</a>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
