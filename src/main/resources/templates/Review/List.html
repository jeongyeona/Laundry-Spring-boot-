<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>후기게시판</title>

    <!-- Bootstrap JS & jQuery -->
    <script
            th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js}"
            integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
            crossorigin="anonymous"></script>
    <script th:src="@{https://code.jquery.com/jquery-2.1.3.min.js}"></script>

    <!-- Bootstrap CSS -->
    <link
            th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css}"
            rel="stylesheet"
            integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
            crossorigin="anonymous"/>

    <!-- Custom CSS -->
    <link th:href="@{/css/nav.css}" rel="stylesheet"/>
    <link th:href="@{/css/subnav.css}" rel="stylesheet"/>
    <link th:href="@{/css/subFooter.css}" rel="stylesheet"/>

    <style>
        /* 1) html,body를 flex 컨테이너로 */
        html, body {
          height: 100%;
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          font-family: 'Noto Sans KR', sans-serif !important;
        }
        /* 3) 본문 영역이 푸터를 밀어올리도록 */
        .content-wrapper {
          flex: 1;
          margin-top: 30px; /* 필요시 상단 여백 */
        }

        /* 공통 스타일 */
        .btn { border-radius: 0 !important; }
        a:hover, .tr_hover:hover { color: rgba(0,0,0,0.6) !important; }

        /* 테이블/네비게이션 스타일 */
        table > th { color:#000; font-size:17px; font-weight:400; }
        table > td { color:#999; font-size:17px; }
        td > a { text-decoration:none; color:inherit; text-align:center; }
        .page-ui a { text-decoration:none; color:#000; }
        .page-ui a:hover { text-decoration:underline; }
        .page-ui a.active { font-weight:bold; text-decoration:underline; }
        .page-ui ul { text-align:center; }
        .page-ui ul > li { display:inline-block; }

        /* 4) 푸터 고정 */
        .footer-fixed {
          position: fixed;
          bottom: 0;
          left: 0;
          width: 100%;
          z-index: 1030;
          background-color: #f8f9fa;
        }
        /* 버튼 */
        .search-btn {
          width: 120px;
          height: 36px;
        }
        .form-inline { display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:30px; }
    </style>
</head>
<body>

<!-- 상단 내비게이션 -->
<div th:replace="fragments/nav :: nav"></div>

<!-- 서브 내비게이션 -->
<div th:replace="fragments/subnav :: subnav('support','review')"></div>

<!-- 본문 (푸터 밀어올리기) -->
<div class="content-wrapper container">
    <!-- 검색 폼 -->
    <div class="form-inline">
        <form class="d-flex align-items-center" th:action="@{/Review/List}" method="get">
            <select class="form-select" name="condition" style="height:36px;">
                <option th:value="'title_content'" th:selected="${condition=='title_content'}">제목+내용</option>
                <option th:value="'title'" th:selected="${condition=='title'}">제목</option>
                <option th:value="'writer'" th:selected="${condition=='writer'}">작성자</option>
            </select>
            <input
                    type="text"
                    class="form-control mx-2"
                    name="keyword"
                    placeholder="검색어…"
                    th:value="${keyword}"
                    style="height:36px;"
            />
            <button class="btn btn-outline-dark search-btn" type="submit">검색</button>
        </form>
    </div>

    <!-- 후기 테이블 -->
    <table class="table">
        <colgroup>
            <col style="width:70px"/><col style="width:30px"/><col style="width:150px"/>
            <col style="width:70px"/><col style="width:50px"/><col style="width:20px"/>
        </colgroup>
        <thead>
        <tr>
            <th>글번호</th><th>작성자</th><th>제목</th>
            <th>조회수</th><th>등록일</th><th>평점</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tmp : ${list}"
            class="tr_hover"
            style="cursor:pointer"
            th:onclick="|window.location='@{/Review/ReviewDetail(code=${tmp.refOrderCode})}'|">
            <td th:text="${tmp.num}">1</td>
            <td th:text="${tmp.writer}">작성자</td>
            <td th:text="${tmp.title}">제목</td>
            <td th:text="${tmp.viewCount}">0</td>
            <td th:text="${tmp.regdate}">2025-05-13</td>
            <td>
            <span th:switch="${tmp.star}">
              <span th:case="1">★☆☆☆☆</span>
              <span th:case="2">★★☆☆☆</span>
              <span th:case="3">★★★☆☆</span>
              <span th:case="4">★★★★☆</span>
              <span th:case="5">★★★★★</span>
              <span th:case="*">☆☆☆☆☆</span>
            </span>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 -->
    <div class="page-ui clearfix" style="display:flex; justify-content:center; margin:30px auto;">
        <ul class="pagination">
            <!-- Prev 버튼 -->
            <li class="page-item" th:if="${pageNum > 1}">
                <a class="page-link"
                   th:href="@{/Review/List(pageNum=${pageNum-1},condition=${condition},keyword=${encodedK})}">
                    &lt;
                </a>
            </li>

            <!-- controller에서 만든 pageNumbers 사용 -->
            <li class="page-item" th:each="i : ${pageNumbers}">
                <a class="page-link"
                   th:classappend="${i == pageNum} ? ' active'"
                   th:href="@{/Review/List(pageNum=${i},condition=${condition},keyword=${encodedK})}"
                   th:text="${i}">
                </a>
            </li>

            <!-- Next 버튼 -->
            <li class="page-item" th:if="${pageNum < totalPageCount}">
                <a class="page-link"
                   th:href="@{/Review/List(pageNum=${pageNum+1},condition=${condition},keyword=${encodedK})}">
                    &gt;
                </a>
            </li>
        </ul>
    </div>
</div>

<!-- 푸터 (고정) -->
<div class="footer-fixed" th:replace="fragments/footer :: footer"></div>
</body>

<script th:if="${msg}" th:inline="javascript">
    alert([[${msg}]]);
</script>
</html>
