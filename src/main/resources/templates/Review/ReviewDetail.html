<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>후기게시판</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/nav.css}"/>
    <link rel="stylesheet" th:href="@{/css/subnav.css}"/>
    <link rel="stylesheet" th:href="@{/css/subFooter.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="http://code.jquery.com/jquery-2.1.3.min.js"></script>

    <style>
        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-wrapper {
            flex: 1;
        }

        .btn { border-radius: 0 !important; }
        * { font-family: 'Noto Sans KR', sans-serif !important; }

        #content {
            height: 200px;
            width: 750px;
        }

        .container > img {
            width: 100%;
            height: 200px;
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <!-- 공통 네비 -->
    <div th:insert="~{fragments/nav :: nav}"></div>

    <!-- 서브 네비 -->
    <div th:replace="~{fragments/subnav :: subnav('support','review')}"></div>

    <div class="container mb-5" style="width:800px; border-top:1px solid #000;"></div>

    <div class="container mb-3" style="width:800px;">
        <img th:src="@{/images/laundry3.png}" alt="laundry image"/>

        <form th:action="${review == null} ? @{/Review/Insert} : @{/Review/ReviewUpdate}"
              method="post"
              id="insertForm">
            <!-- 주문번호 (hidden) -->
            <input type="hidden" name="code" th:value="${code}"/>

            <input type="hidden"
                   name="num"
                   th:if="${review != null}"
                   th:value="${review.num}" />

            <div class="mt-3 mb-3">
                <label class="form-label" for="title">제목</label>
                <input class="form-control"
                       type="text"
                       name="title"
                       id="title"
                       th:value="${review != null} ? ${review.title} : ''">
            </div>

            <div class="mb-3">
                <label for="code">주문번호</label>
                <input type="text" id="code" th:value="${code}" disabled class="form-control"/>
            </div>
            <div class="mb-3">
                <label for="items">품목</label>
                <input type="text" id="items" th:value="${itemsText}" disabled class="form-control"/>
            </div>

            <div class="mb-3">
                <label class="form-label" for="star">평점</label>
                <select name="star" id="star" class="form-select">
                    <option value="1"
                            th:selected="${review != null and review.star == 1}">
                        ★☆☆☆☆
                    </option>
                    <option value="2"
                            th:selected="${review != null and review.star == 2}">
                        ★★☆☆☆
                    </option>
                    <option value="3"
                            th:selected="${review == null or (review != null and review.star == 3)}">
                        ★★★☆☆
                    </option>
                    <option value="4"
                            th:selected="${review != null and review.star == 4}">
                        ★★★★☆
                    </option>
                    <option value="5"
                            th:selected="${review != null and review.star == 5}">
                        ★★★★★
                    </option>
                </select>
            </div>

            <div class="container px-0">
                <label class="form-label" for="content">내용</label>
                <textarea class="form-control"
                          name="content"
                          id="content"
                          th:text="${review != null} ? ${review.content} : ''"
                          th:readonly="${review != null}"></textarea>
            </div>

            <div class="text-end">
                <!-- 🔹 리뷰가 아직 없을 때: 저장 버튼 -->
                <button class="btn btn-outline-secondary mt-3 mb-5"
                        type="submit"
                        th:if="${review == null}">
                    저장
                </button>

                <!-- 리뷰가 있을 때 + 본인 or 관리자만 버튼 표시 -->
                <!-- 수정 -->
                <button class="btn btn-outline-primary mt-3 mb-5"
                        type="submit"
                        th:if="${review != null and (review.writer == loginUserId or manager == 'Y')}">
                    수정
                </button>

                <!-- 삭제 -->
                <button class="btn btn-outline-danger mt-3 mb-5"
                        type="submit"
                        th:if="${review != null and (review.writer == loginUserId or manager == 'Y')}"
                        th:formaction="@{/Review/ReviewDelete}"
                        name="num"
                        th:value="${review.num}"
                        onclick="return confirm('정말 삭제하시겠습니까?');">
                    삭제
                </button>

                <!-- 목록 버튼: 항상 표시 -->
                <a th:href="@{/Review/List}"
                   class="btn btn-outline-secondary mt-3 mb-5">
                    목록
                </a>
            </div>

        </form>
    </div>
</div>

<!-- SmartEditor: 리뷰 없을 때만 로딩 -->
<script th:src="@{/SmartEditor/js/HuskyEZCreator.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var oEditors = [];

    nhn.husky.EZCreator.createInIFrame({
        oAppRef: oEditors,
        elPlaceHolder: "content",
        sSkinURI: /*[[@{/SmartEditor/SmartEditor2Skin.html}]]*/ "",
        htParams : {
            bUseToolbar : true,
            bUseVerticalResizer : true,
            bUseModeChanger : true,
            fOnBeforeUnload : function(){ }
        },
        fOnAppLoad : function(){ },
        fCreator: "createSEditor2"
    });

    // 폼 submit 시 내용 검증
    document.querySelector("#insertForm")
        .addEventListener("submit", function(e){
            // SmartEditor 내용 -> textarea 로 동기화
            oEditors.getById["content"].exec("UPDATE_CONTENTS_FIELD", []);

            const title = document.querySelector("#title").value;

            if(title.length < 2){
                alert("제목을 2글자 이상 입력하세요!");
                e.preventDefault();
            }
        });
    /*]]>*/
</script>

<script th:if="${msg}" th:inline="javascript">
    alert([[${msg}]]);
</script>

<!-- 푸터 -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
