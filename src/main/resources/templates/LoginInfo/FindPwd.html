<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기</title>

  <!-- Bootstrap CSS -->
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css}"
        rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
        crossorigin="anonymous"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/nav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subnav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subFooter.css}"/>

  <style>
    html, body { height:100%; margin:0; padding:0; }
    body { display:flex; flex-direction:column; font-family:'Noto Sans KR',sans-serif; }
    main.content-wrap { flex:1; }
    #findpwdform_wr { width:100%; text-align:center; padding-top:2rem; }
    #body_content { width:25%; display:inline-block; }
    .input-group-text { border-color:#dddddd; border-radius:0; width:80px; }
    .input-group .form-control { border:1px solid #dddddd; border-radius:0; }
    #idFindBtn { border-color:#dddddd; border-radius:0; }
    #idFindBtn:hover { background-color:black; color:white; }
  </style>
</head>
<body>
<!-- Main Navigation -->
<div th:insert="fragments/nav :: nav"></div>

<!-- Sub Navigation -->
<div th:insert="fragments/subnav :: subnav('findpwd','findpwd')"></div>

<main class="content-wrap">
  <div id="findpwdform_wr">
    <div id="body_content">
      <!-- Step 1: 사용자 검증 폼 -->
      <form id="findPwdForm" autocomplete="off">
        <div class="input-group mb-3">
          <span class="input-group-text">아이디</span>
          <input class="form-control" type="text" id="id" name="id" required />
        </div>
        <div class="input-group mb-3">
          <span class="input-group-text">이름</span>
          <input class="form-control" type="text" id="name" name="name" required />
        </div>
        <div class="input-group mb-3">
          <span class="input-group-text">E-mail</span>
          <input class="form-control" type="email" id="email" name="email" required />
        </div>
        <div class="row row-cols-1">
          <div class="col d-grid gap-1 mx-auto mb-3">
            <button class="btn btn-dark" type="submit" style="border-radius:0;">계속</button>
          </div>
          <div class="col">
            <a th:href="@{/LoginInfo/FindId}" class="btn" id="idFindBtn">Forgot ID?</a>
          </div>
        </div>
      </form>

      <div id="addPwdForm"></div>
    </div>
  </div>
</main>

<!-- Footer -->
<div th:insert="fragments/footer :: footer" class="footer-sticky"></div>

<!-- Bootstrap JS & jQuery -->
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js}" crossorigin="anonymous"></script>
<script th:src="@{https://code.jquery.com/jquery-3.6.0.min.js}"></script>

<!-- AJAX 처리 스크립트 -->
<script th:inline="javascript">
  /*<![CDATA[*/
    document.getElementById('findPwdForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form   = this;
      const params = new URLSearchParams(new FormData(form)).toString();

      // 1) JSON 유효성 검사
      fetch(/*[[@{/LoginInfo/FindPwdCheck}]]*/, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
        body: params
      })
      .then(res => res.json())
      .then(json => {
        if (!json.valid) {
          alert('입력하신 정보와 일치하는 회원정보가 없습니다.');
          throw 'halt';
        }
        // 검증 성공 → id 미리 저장, 폼 제거
        const userId = form.querySelector('#id').value;
        form.remove();
        return userId;
      })
      // 2) fragment 로드: POST /LoginInfo/FindPwdForm
      .then(userId => fetch(/*[[@{/LoginInfo/FindPwdForm}]]*/, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
        body: `id=${encodeURIComponent(userId)}`
      }))
      .then(res => res.text())
      .then(html => {
        document.getElementById('addPwdForm').innerHTML = html;
      })
      .catch(err => {
        if (err !== 'halt') console.error(err);
      });
    });
  /*]]>*/
</script>
</body>
</html>
