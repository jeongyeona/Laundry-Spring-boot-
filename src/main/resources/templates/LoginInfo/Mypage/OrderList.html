<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>신청내역확인</title>
  <link rel="stylesheet" th:href="@{/css/nav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subnav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subFooter.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="http://code.jquery.com/jquery-2.1.3.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .footer-sticky {
      height: 100px;
      background-color: #f8f9fa;
      border-top: 1px solid #ccc;
      position: relative;
      bottom: 0;
      width: 100%;
      margin-top: auto;
    }
    .btn {
      border-radius: 0;
    }
    @media (max-width: 768px) {
      #order_wr {
        flex-direction: column;
        padding: 1rem;
        overflow-x: auto;
      }
      #keyword {
        width: 100% !important;
        margin-top: 0.5rem;
      }
      #condition {
        width: 100% !important;
        margin-top: 0.5rem;
      }
      .form-select-lg {
        font-size: 1rem;
      }
      .table-responsive {
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>
<div class="wrapper">
  <div th:insert="~{fragments/nav :: nav}"></div>
  <div th:replace="~{fragments/subnav :: subnav('mypage','orderlist')}"></div>

  <div class="container" style="width:1320px;">
    <table class="table table-hover">
      <thead>
      <tr>
        <th>주문번호</th>
        <th>주문상세정보</th>
        <th>주문가격</th>
        <th>배송지</th>
        <th>예약일</th>
        <th>수거일</th>
        <th>처리상태</th>
        <th>후기작성</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${list}">
        <td th:text="${item.code}"></td>
        <td><a th:href="@{/LoginInfo/Mypage/OrderDetail(code=${item.code})}">상세정보보기</a></td>
        <td th:text="${#numbers.formatDecimal(item.orderPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
        <td th:text="${item.orderAddr}"></td>
        <td th:text="${item.regdate}"></td>
        <td th:text="${item.reservationDate}"></td>
        <td th:text="${item.state != null && !#strings.isEmpty(item.state) ? item.state : '예약완료'}"></td>
        <td th:if="${item.orderer == id and item.state == '반환완료'}">
          <a th:href="@{/Review/ReviewDetail(code=${item.code})}">
            작성하기
          </a>
        </td>
        <td th:if="${!(item.orderer == id and item.state == '반환완료')}"></td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- 페이지네이션 -->
  <div class="page-ui my-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:if="${startPageNum > 1}">
        <a class="page-link"
           th:href="@{/LoginInfo/Mypage/OrderList(pageNum=${startPageNum - 1}, pageSize=${pageSize}, condition=${condition}, keyword=${keyword}, state=${state})}">
          Prev
        </a>
      </li>

      <li class="page-item" th:each="i : ${pageNumbers}">
        <a class="page-link"
           th:classappend="${i == pageNum} ? ' active'"
           th:href="@{/LoginInfo/Mypage/OrderList(pageNum=${i}, pageSize=${pageSize}, condition=${condition}, keyword=${keyword}, state=${state})}"
           th:text="${i}">1</a>
      </li>

      <li class="page-item" th:if="${endPageNum < totalPageCount}">
        <a class="page-link"
           th:href="@{/LoginInfo/Mypage/OrderList(pageNum=${endPageNum + 1}, pageSize=${pageSize}, condition=${condition}, keyword=${keyword}, state=${state})}">
          Next
        </a>
      </li>
    </ul>
  </div>

</div>
<script th:if="${msg}" th:inline="javascript">
  alert([[${msg}]]);
</script>
<script th:if="${refundMessage}" th:inline="javascript">
  alert([[${refundMessage}]]);
</script>
<!-- 푸터는 wrapper 밖에서 절대 고정 -->
<div class="footer-sticky" th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
