<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문관리</title>
    <link rel="stylesheet" th:href="@{/css/nav.css}"/>
    <link rel="stylesheet" th:href="@{/css/subnav.css}"/>
    <link rel="stylesheet" th:href="@{/css/subFooter.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      #order_wr {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .footer-sticky {
        margin-top: auto;
        height: 100px;
        background-color: #f8f9fa;
        border-top: 1px solid #ccc;
      }

      .btn {
        border-radius: 0;
      }

      @media (max-width: 768px) {
        #order_wr {
          flex-direction: column;
          padding: 1rem;
          overflow-x: auto;
        }
        #keyword {
          width: 100% !important;
          margin-top: 0.5rem;
        }
        #condition {
          width: 100% !important;
          margin-top: 0.5rem;
        }
        .form-select-lg {
          font-size: 1rem;
        }
        .table-responsive {
          overflow-x: auto;
        }
      }
    </style>
</head>
<body>
<div class="wrapper">
    <div th:insert="~{fragments/nav :: nav}"></div>
    <div th:replace="~{fragments/subnav :: subnav('mypage','orderlist')}"></div>
    <div id="order_wr" class="container my-4">
        <div id="body_content" class="w-100">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <form th:action="@{/order}" method="get" id="searchForm" class="d-flex flex-wrap gap-2">
                    <input type="hidden" name="state" th:value="${state}" />
                    <select name="condition" id="condition" class="form-select form-select-lg" style="width: 150px;">
                        <option th:selected="${condition} == 'code'">주문번호</option>
                        <option value="orderer_name" th:selected="${condition} == 'orderer_name'">아이디/이름</option>
                    </select>
                    <input type="text" class="form-control form-control-lg" id="keyword" name="keyword" placeholder="검색어를 입력해주세요" th:value="${keyword}" style="width: 300px;"/>
                    <button type="submit" class="btn btn-dark btn-lg">검색</button>
                </form>

                <div class="d-flex align-items-center gap-2">
                    <select name="courier" id="courier" class="form-select" style="width:200px;">
                        <option th:each="c : ${courierList}" th:value="${c.courierCode}" th:text="${c.courierName}" th:selected="${c.courierCode == 'kr.epost'}"></option>
                    </select>
                    <button type="button" id="getBtn" class="btn btn-dark">수거용 송장번호 발급</button>
                    <button type="button" id="sendBtn" class="btn btn-dark">반환용 송장번호 발급</button>
                </div>
            </div>

            <form th:action="@{/admin_order_update}" id="orderForm" method="post">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <button type="button" id="updateBtn" class="btn btn-dark">수정</button>
                    <button type="button" id="changeBtn" class="btn btn-info" style="display:none;">확인</button>
                    <button type="button" id="cancleBtn" class="btn btn-secondary" style="display:none;">취소</button>
                    <select id="updateState" name="state" class="form-select" style="width:150px;" disabled>
                        <option>상태</option>
                        <option>수거중</option>
                        <option>수거완료</option>
                        <option>세탁중</option>
                        <option>세탁완료</option>
                        <option>반환중</option>
                        <option>반환완료</option>
                    </select>
                </div>

                <div class="table-responsive" id="order_table">
                    <table class="table align-middle text-center">
                        <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" id="allCheck" class="form-check-input"/></th>
                            <th>주문번호</th>
                            <th>주문자</th>
                            <th>주문금액</th>
                            <th>
                                <select id="state" class="form-select">
                                    <option th:selected="${state == '상태'}">상태</option>
                                    <option th:each="s : ${states}" th:value="${s}" th:text="${s}" th:selected="${state == s}"></option>
                                </select>
                            </th>
                            <th>예약일</th>
                            <th>요청일</th>
                            <th>수거용 송장번호</th>
                            <th>반환용 송장번호</th>
                            <th>...</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tmp : ${list}" class="selectRow">
                            <td><input type="checkbox" class="form-check-input" name="codes" th:value="${tmp.code}" th:data-state="${tmp.state}" th:data-courier1="${tmp.getCourier}" th:data-courier2="${tmp.sendCourier}"/></td>
                            <td th:text="${tmp.code}"></td>
                            <td th:text="${tmp.orderer}"></td>
                            <td th:text="${#numbers.formatInteger(tmp.orderPrice, 3, 'COMMA')}"></td>
                            <td th:text="${tmp.state}"></td>
                            <td th:text="${tmp.regdate}"></td>
                            <td th:text="${tmp.reservationDate}"></td>
                            <td th:text="${tmp.getCourier != null ? tmp.getInvoiceNum : '-'}"></td>
                            <td th:text="${tmp.sendCourier != null ? tmp.sendInvoiceNum : '-'}"></td>
                            <td><a th:href="@{/LoginInfo/Mypage/OrderDetail(code=${tmp.code})}" class="btn">...</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </form>

            <!-- 페이징 -->
            <div class="page-ui my-4">
                <ul class="pagination justify-content-center">
                    <!-- Prev -->
                    <li class="page-item" th:if="${startPageNum > 1}">
                        <a class="page-link"
                           th:href="@{/Admin/OrderList(pageNum=${startPageNum - 1}, pageSize=${pageSize}, condition=${condition}, keyword=${keyword}, state=${state})}">
                            Prev
                        </a>
                    </li>

                    <!-- 페이지 번호 -->
                    <li class="page-item" th:each="i : ${pageNumbers}">
                        <a class="page-link"
                           th:href="@{/Admin/OrderList(pageNum=${i}, pageSize=${pageSize}, condition=${condition}, keyword=${keyword}, state=${state})}"
                           th:classappend="${i == pageNum} ? ' active'" th:text="${i}"></a>
                    </li>

                    <!-- Next -->
                    <li class="page-item" th:if="${endPageNum < totalPageCount}">
                        <a class="page-link"
                           th:href="@{/Admin/OrderList(pageNum=${endPageNum + 1}, pageSize=${pageSize}, condition=${condition}, keyword=${keyword}, state=${state})}">
                            Next
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="footer-sticky" th:replace="~{fragments/footer :: footer}"></div>
</div>
<script th:src="@{/js/gura_util.js}"></script>
<script>
    document.querySelector("#state").addEventListener("change",function(){
        let val=this.value;
        location.href="order.do?state="+val+"&condition=${condition }&keyword=${encodedK }";
    });

    let selectRows=document.querySelectorAll(".selectRow");
    let checks=document.querySelectorAll('.selectRow input[type=checkbox]');
    for(let i=0;i<selectRows.length;i++){
        selectRows[i].addEventListener("click", function(){
            if(checks[i].checked==false){
                checks[i].checked =true;
            }else{
                checks[i].checked =false;
            }

        });
    }
    for(let i=0;i<checks.length;i++){
        checks[i].addEventListener("click", function(event){
            event.stopPropagation(); //부모객체에 전파되는걸 막는 함수
        });
    }

    document.querySelector("#allCheck").addEventListener("click",function(){
        for(let i=0;i<selectRows.length;i++){
            if(this.checked==true){
                checks[i].checked =true;
            }else{
                checks[i].checked =false;
            }
        }
    });


    let updateBtn=document.querySelector("#updateBtn");
    let changeBtn=document.querySelector("#changeBtn");
    let cancleBtn=document.querySelector("#cancleBtn");
    let updateState=document.querySelector("#updateState");

    updateBtn.addEventListener("click",function(){
        this.style.display="none";
        changeBtn.style.display="inline";
        cancleBtn.style.display="inline";
        updateState.removeAttribute('disabled');
    });

    cancleBtn.addEventListener("click",function(){
        this.style.display="none";
        changeBtn.style.display="none";
        updateBtn.style.display="inline";
        updateState.setAttribute('disabled',true);
        $('#updateState').val('상태').prop('selected',true);
    });

    changeBtn.addEventListener("click",function(){
        let updateUsers=document.querySelectorAll('.selectRow input[type=checkbox]:checked');

        if(updateUsers.length==0){
            alert("수정할 회원을 선택해주세요.");
            return;
        }else if(updateState.value=='상태'){
            alert("변경할 상태를 선택해주세요.");
            return;
        }else{
            if (!confirm("상태를 '"+updateState.value+"' 로 변경하시겠습니까?")) {
                return;
            } else {
                let form=document.querySelector("#orderForm");
                ajaxFormPromise(form)
                .then(function(res){
                    return res.json();
                })
                .then(function(data){
                    if(data.isSuccess == true){
                        alert(data.count+'명의 회원을 수정했습니다');
                        location.href="${pageContext.request.contextPath}/mypage/order.do";
                    }else{
                        alert('회원 수정에 실패했습니다.');
                    }
                });
            }
        }
    });

    document.querySelector("#getBtn").addEventListener("click",function(){
        let updateUsers=document.querySelectorAll('.selectRow input[type=checkbox]:checked');

        if(updateUsers.length==0){
            alert("회원을 선택해주세요.");
            return;
        }else{
            for(let i=0;i<updateUsers.length;i++){
                if(updateUsers[i].dataset.state !== '결제완료'){
                    alert('결제완료인 주문만 발급가능합니다.');
                    return;
                }

                const courier = updateUsers[i].dataset.courier1 ?? '';
                if (courier.trim() !== '') {
                    alert('발급은 한번만 가능합니다.');
                    return;
                }
            }
            if (!confirm("택배사를 '"+$('#courier option:checked').text()+"' 로 선택하시겠습니까?")) {
                return;
            } else {
                let form=document.querySelector("#orderForm");
                form.setAttribute('action','AdminInsertCourier');
                ajaxFormPromise(form)
                .then(function(res){
                    return res.json();
                })
                .then(function(data){
                    if(data.isSuccess == true){
                        alert(data.count+'명의 회원의 송장번호를 발급했습니다');
                        location.href="${pageContext.request.contextPath}/Mypage/admin/OrderList";
                    }else{
                        alert('송장번호 발급이 실패했습니다.');
                    }
                });
            }

        }
    });

    document.querySelector("#sendBtn").addEventListener("click",function(){
        let updateUsers=document.querySelectorAll('.selectRow input[type=checkbox]:checked');

        if(updateUsers.length==0){
            alert("회원을 선택해주세요.");
            return;
        }else{
            for(let i=0;i<updateUsers.length;i++){
                if(updateUsers[0].dataset.state != '세탁완료'){
                    alert('세탁완료인 주문만 발급가능합니다.');
                    return;
                }

                if(updateUsers[0].dataset.courier2 != ''){
                    alert('발급은 한번만 가능합니다.');
                    return;
                }
            }
            if (!confirm("택배사를 '"+$('#courier option:checked').text()+"' 로 선택하시겠습니까?")) {
                return;
            } else {
                let form=document.querySelector("#orderForm");
                form.setAttribute('action','admin_insert_courier2.do');
                ajaxFormPromise(form)
                .then(function(res){
                    return res.json();
                })
                .then(function(data){
                    if(data.isSuccess == true){
                        alert(data.count+'명의 회원의 송장번호를 발급했습니다');
                        location.href="${pageContext.request.contextPath}/mypage/order.do";
                    }else{
                        alert('송장번호 발급이 실패했습니다.');
                    }
                });
            }
        }
    });
</script>
</body>
</html>
