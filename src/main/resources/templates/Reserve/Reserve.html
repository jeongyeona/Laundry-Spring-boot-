<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>상품선택</title>

  <!-- DateTimePicker CSS -->
  <link rel="stylesheet"
        th:href="@{/css/jquery.datetimepicker.min.css}"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/reserve.css}"/>
  <link rel="stylesheet" th:href="@{/css/nav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subFooter.css}"/>
  <link rel="stylesheet" th:href="@{/css/subnav.css}"/>

  <!-- Bootstrap CSS -->
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css}"
        rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
        crossorigin="anonymous"/>

  <style>
    .number{
      width: 100%;
    }

    .order_list{
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 8px;
      box-sizing: border-box;
    }

    .order_row{
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .order_row .name{
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .order_row input.product{
      width: 70px;
      flex: 0 0 auto;
    }

    .order_row .price{
      width: 90px;
      text-align: right;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
<!-- 네비게이션 -->
<div th:replace="fragments/nav :: nav"></div>

<!-- 서브 내비게이션 -->
<div th:replace="fragments/subnav :: subnav('reserve','reserve')"></div>

<div class="container" style="margin-top: 30px;">
  <p class="prod">step02 상품선택</p>

  <main id="order_wrap">
    <div class="left">
      <img th:src="${category == 'clothes'  ? '/images/990A4A4A5DB90F5C2F.png'
             : category == 'bedding' ? '/images/10_1555258129.png'
             : category == 'shoes' ? '/images/운동화빨래방법.jpg'
             : '/images/Z4C60MKTH4DOG0TBN5AL.jpg'}"
           alt="상품 이미지"
           style="border-radius:2%;" />
    </div>
    <div class="right">
      <div class="top">
        <h1>상품 구매</h1>
        <dl>
          <dt>상품명</dt>
          <dd th:text="
            ${category == 'clothes' ? '생활빨래'
             : category == 'bedding' ? '침구류'
             : category == 'shoes' ? '운동화·구두'
             : category == 'living' ? '리빙'
             : ''}">
          </dd>
          <dt>옵션</dt>
          <dd>
            <select id="product" class="form-select">
              <optgroup label="상품선택">
                <option value="" disabled selected>선택해주세요</option>
                <option th:each="item : ${list}"
                        th:attr="data-inum=${item.inum}"
                        th:value="${item.price}"
                        th:text="${item.item}">
                </option>
              </optgroup>
            </select>
          </dd>

          <dt>예약날짜</dt>
          <dd>
            <input type="text"
                   id="one"
                   class="date form-control"
                   autocomplete="off"/>
          </dd>
        </dl>

        <div class="number">
          <div class="order_list"></div>
        </div>

        <div class="total_price">
          <p>총 상품 금액</p>
          <p class="result_price" value="0"></p>
        </div>
      </div>

      <div class="bottom">
        <button type="button"
                onclick="nextViewPage()"
                id="order_btn">
          예약하기
        </button>
      </div>
    </div>
  </main>

  <div class="explain">
    <h1>수거 및 배송 안내</h1>
    <img th:src="@{/images/umile_vx_1-768x303.png}"
         alt="수거/배송 안내"/>

    <div class="process">
      <p>
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16" height="16"
             fill="currentColor"
             class="bi bi-1-circle"
             viewBox="0 0 16 16">
          <path d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8Zm15
                     0A8 8 0 1 1 0 8a8 8 0 0 1 16 0ZM9.283
                     4.002V12H7.971V5.338h-.065L6.072
                     6.656V5.385l1.899-1.383h1.312Z"/>
        </svg>
        수거
      </p>
      <p>
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16" height="16"
             fill="currentColor"
             class="bi bi-2-circle"
             viewBox="0 0 16 16">
          <path d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1
                     8Zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16
                     0ZM6.646 6.24v.07H5.375v-.064c0-1.213.879-2.402
                     2.637-2.402 1.582 0 2.613.949 2.613 2.215
                     0 1.002-.6 1.667-1.287 2.43l-.096.107-1.974
                     2.22v.077h3.498V12H5.422v-.832l2.97-3.293c.434-.475.903-1.008.903-1.705
                     0-.744-.557-1.236-1.313-1.236-.843
                     0-1.336.615-1.336 1.306Z"/>
        </svg>
        세탁 및 건조
      </p>
      <p>
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16" height="16"
             fill="currentColor"
             class="bi bi-3-circle"
             viewBox="0 0 16 16">
          <path d="M7.918 8.414h-.879V7.342h.838c.78
                   0 1.348-.522 1.342-1.237 0-.709-.563-1.195-1.348-1.195-.79
                   0-1.312.498-1.348 1.055H5.275c.036-1.137.95-2.115
                   2.625-2.121 1.594-.012 2.608.885 2.637
                   2.062.023 1.137-.885 1.776-1.482
                   1.875v.07c.703.07 1.71.64 1.734
                   1.917.024 1.459-1.277 2.396-2.93
                   2.396-1.705 0-2.707-.967-2.754-2.144H6.33c.059.597.68
                   1.06 1.541 1.066.973.006
                   1.6-.563 1.588-1.354-.006-.779-.621-1.318-1.541-1.318Z"/>
          <path d="M16 8A8 8 0 1 1 0
                   8a8 8 0 0 1 16 0ZM1 8a7 7 0 1 0
                   14 0A7 7 0 0 0 1 8Z"/>
        </svg>
        배송
      </p>
    </div>

    <div class="procedure">
      <img th:src="@{/images/다운로드.jpg}"
           alt="절차1"/>
      <img th:src="@{/images/96167986-평면-현대적인-디자인에-세탁-서비스-벡터-일러스트입니다-청소-개념.webp}"
           alt="절차2"/>
      <img th:src="@{/images/115710901-세탁-및-깨끗한-아이콘의-고립-된-개체입니다-주식에-대-한-세탁-및-옷-벡터-아이콘의-집합입니다-.webp}"
           alt="절차3"/>
    </div>

    <h2>Laundry365에서<br/>깨끗하고 안전하게! 배송해드리겠습니다!</h2>
  </div>
</div>

<!-- JS: jQuery & DateTimePicker -->
<script th:src="@{/js/jquery-3.4.1.js}"></script>
<script th:src="@{/js/jquery.datetimepicker.full.min.js}"></script>

<script th:inline="javascript">
  /*<![CDATA[*/
    $(function () {
      $.datetimepicker.setLocale("ko");

      var tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(0, 0, 0, 0);

      if ($("#one").data("xdsoft_datetimepicker")) {
        $("#one").datetimepicker("destroy");
      }

      // ✅ 과거 입력도 못 하게
      $("#one").prop("readonly", true);

      $("#one").datetimepicker({
        format: "Y-m-d H:i",
        step: 30,

        // ✅ 내일부터
        minDate: tomorrow,

        minTime: "00:00",
        maxTime: "23:30",

        // ✅ 기본값 내일 00:00
        value: tomorrow,

        onShow: function () {
          this.setOptions({
            minDate: tomorrow,
            minTime: "00:00",
            maxTime: "23:30"
          });
        }
      });
    });




    let idNum = 0;
    let inums = "";
    let selectedInumSet = {}; // {inum: true}

    $("#product").on("change", function () {
      let $opt = $("#product option:selected");
      let inum = $opt.data("inum");
      let price = parseInt($opt.val(), 10);
      let name = $opt.text();

      if (!inum || isNaN(price)) return;

      if (selectedInumSet[inum]) {
        alert("이미 선택한 상품입니다.");
        $("#product").val("");
        return;
      }

      selectedInumSet[inum] = true;

      idNum++;
      inums += inum + "/";

      $(".order_list").append(
        `<div class="order_row" data-inum="${inum}">
           <div class="name">${name}</div>
           <input type="number" class="product" min="1" max="30" value="1"
                  onchange="history(this.value,${price},'num${idNum}');" id="num${idNum}">
           <div class="price in num${idNum}" data-inum="${inum}">${price}</div>
         </div>`
      );

      $("#product").val("");
      ttt();
    });

    function history(countNum, countPrice, getId) {
      let total = parseInt(countNum, 10) * parseInt(countPrice, 10);
      $("." + getId).text(total);
      ttt();
    }

    function ttt() {
      let sum = 0;
      $(".order_list .in").each(function(){
        sum += parseInt($(this).text(), 10);
      });
      $(".result_price").text(sum);
    }

    function nextViewPage() {
      let sum  = '이름';
      let sum2 = '가격';
      let sum3 = '수량';
      let sum4 = '예약날짜';
      let sum5 = '번호';   // ✅ number도 같은 포맷으로

      let dateVal = $("#one").val();
      if (!dateVal) { alert('예약 날짜를 선택해주세요'); return; }

      if (!$(".order_list .order_row").length) {
        alert('상품을 선택해 주세요');
        return;
      }

      $(".order_list .order_row").each(function(){
        let nameText = $(this).find(".name").text();
        let qtyVal   = $(this).find("input.product").val();

        // ✅ 표시용 텍스트에서 숫자만 추출
        let priceText = $(this).find(".in").text();     // "1,800원" 등
        let priceVal  = (priceText || '').replace(/[^\d]/g, '');
        if (!priceVal) priceVal = "0";

        // ✅ row에 inum이 있다면 여기서 가져와 누적 (예: data-inum)
        let inumVal = $(this).data("inum") || $(this).find("input.inum").val() || "";

        sum  += '/' + nameText;
        sum2 += '/' + priceVal;
        sum3 += '/' + qtyVal;
        sum5 += '/' + inumVal;
      });

      sum4 += '/' + dateVal;

      const baseUrl  = /*[[@{/Reserve/Payment}]]*/ '';
      const category = /*[[${param.category}]]*/ '';

      const text = `${baseUrl}?name=${encodeURIComponent(sum)}`
                 + `&price=${encodeURIComponent(sum2)}`
                 + `&count=${encodeURIComponent(sum3)}`
                 + `&date=${encodeURIComponent(sum4)}`
                 + `&number=${encodeURIComponent(sum5)}`
                 + `&category=${encodeURIComponent(category)}`;

      location.href = text;
    }
  /*]]>*/
</script>


<!-- 푸터 -->
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
