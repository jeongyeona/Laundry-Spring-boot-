<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>reserve_service</title>

  <!-- Bootstrap CSS -->
  <link
          th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css}"
          rel="stylesheet"
          integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
          crossorigin="anonymous"/>

  <!-- Custom CSS -->
  <link th:href="@{/css/nav.css}" rel="stylesheet"/>
  <link th:href="@{/css/subnav.css}" rel="stylesheet"/>
  <link th:href="@{/css/subFooter.css}" rel="stylesheet"/>

  <!-- Animate.css -->
  <link
          th:href="@{https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css}"
          rel="stylesheet"/>

  <style>
    /* 1) 전체 레이아웃 */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: 'Noto Sans KR', sans-serif !important;
    }
    body {
      background: #f5f5f5;
    }
    .content-wrapper {
      flex: 1;           /* 본문이 푸터를 밀어 올리도록 */
      margin-top: 30px;
    }

    /* 2) 푸터 고정 */
    .footer-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 1030;
      background-color: #f8f9fa;
    }

    /* 3) 서비스 선택 UI 스타일 */
    .at { text-decoration: none; color: black; }
    .at:hover { color: #6b6b6b; }
    .imga { width: 50px; height: 50px; }
    .main_back { background-color: #f5f5f5; padding-bottom: 100px; }
    .container.text-center {
      color: #6b6b6b;
      background-color: #fff;
      max-width: 1000px;
      padding: 0!important;
    }
    .row-cols-2 {
      width: 100%!important;
      margin: 0 auto;
    }
    .text_loc { margin-top: 5px; }
    .sm_text { font-size: 0.8em; }
    .col {
      height: 350px;
      text-align: center;
      padding: 100px 0;
      border: 15px solid #f5f5f5;
    }
    .select_box:hover {
      animation: pulse 1s;
    }
  </style>
</head>
<body>
<!-- 상단 내비게이션 -->
<div th:replace="fragments/nav :: nav"></div>

<!-- 서브 내비게이션 -->
<div th:replace="fragments/subnav :: subnav('reserve','reserve')"></div>

<!-- 본문 -->
<div class="content-wrapper">
  <div class="main_back">
    <div class="container text-center">
      <div class="row row-cols-2">
        <div class="col select_box">
          <a th:href="@{/Reserve/Select(category='clothes')}" class="at">
            <img th:src="@{/images/service1.png}" class="imga" alt="생활빨래"/>
            <p>생활빨래</p>
            <p class="sm_text">좋은 세제와 향기를<br/>고객분들에게 다가갑니다.</p>
          </a>
        </div>
        <div class="col select_box">
          <a th:href="@{/Reserve/Select(category='bedding')}" class="at">
            <img th:src="@{/images/service2.png}" class="imga" alt="침구류"/>
            <p>침구류</p>
            <p class="sm_text">다양한 이불들을<br/>저렴한 세탁으로 만나보세요.</p>
          </a>
        </div>
        <div class="col select_box">
          <a th:href="@{/Reserve/Select(category='shoes')}" class="at">
            <img th:src="@{/images/service3.png}" class="imga" alt="운동화"/>
            <p>운동화,구두</p>
            <p class="sm_text">세탁하기 번거로운<br/>운동화를 깨끗하게!</p>
          </a>
        </div>
        <div class="col select_box">
          <a th:href="@{/Reserve/Select(category='living')}" class="at">
            <img th:src="@{/images/service4.png}" class="imga" alt="리빙"/>
            <p class="text_loc">리빙</p>
            <p class="sm_text">미세먼지 없는<br/>집안생활은 리빙세탁으로!</p>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 고정된 푸터 -->
<div class="footer-fixed" th:replace="fragments/footer :: footer"></div>

<!-- JS -->
<script th:src="@{https://code.jquery.com/jquery-3.4.1.min.js}"></script>
<script
        th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js}"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
</body>
</html>
