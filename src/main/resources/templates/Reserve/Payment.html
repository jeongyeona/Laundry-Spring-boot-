<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>결제화면</title>

  <style>
    span { font-size: x-large; }
    p { font-size: large; font-weight: bold; margin:30px 0; }
    .step { margin-bottom:50px; }
    .container { background:#fff; min-height:1000px; margin-top:30px; margin-bottom:50px;}
    .addr { margin-bottom:30px; }
    #selectPay_transpay p { margin:10px 10px 10px 35px; }
    #selectPay_transpay img { margin-bottom:10px; }
    #postcode { width:200px; display:inline-block; margin-bottom:10px; }
    #address { width:405px; margin-bottom:-15px; }
    #detailAddress { width:200px; display:inline; }
    #extraAddress { width:200px; display:inline; }
    input { margin-bottom:10px !important; }
  </style>

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/nav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subnav.css}"/>
  <link rel="stylesheet" th:href="@{/css/subFooter.css}"/>

  <!-- Bootstrap CSS -->
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css}"
        rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
        crossorigin="anonymous"/>

  <!-- jQuery -->
  <script th:src="@{https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js}"></script>
</head>
<body>
<!-- 네비게이션 -->
<div th:replace="fragments/nav :: nav"></div>

<!-- 서브내비게이션 -->
<div th:replace="fragments/subnav :: subnav('reserve','reserve')"></div>

<form th:action="@{/Reserve/Insert}" method="post" id="insertForm">
  <input type="hidden" name="merchant_uid" id="merchant_uid"/>
  <input type="hidden" name="imp_uid" id="imp_uid"/>
  <div class="container">

    <!-- Step03 결제창 -->
    <div class="addrForm">
      <div class="step">
        <span>Step03 결제창</span>
      </div>

      <div class="product">
        <!-- category를 hidden 으로 넘김 -->
        <input type="hidden" name="category" th:value="${param.category}"/>

        <p>상품정보</p>
        <div class="mb-2">
          <label class="form-label" for="orderer">주문자 아이디</label>
          <input type="text" readonly class="form-control"
                 name="orderer" id="orderer"
                 th:value="${dto.id}"/>
        </div>
        <div class="mb-2">
          <label class="form-label" for="productcount">상품, 수량</label>
          <input type="text" readonly class="form-control"
                 name="productcount" id="productcount"
                 th:value="|${paramName}, ${paramCount}|"/>
        </div>
        <div class="mb-2">
          <label class="form-label" for="order_price">총 주문가격</label>
          <input type="text" readonly class="form-control"
                 name="order_price" id="order_price"
                 th:value="${paramPrice}"/>
        </div>
        <div class="mb-2">
          <label class="form-label" for="reservation_date">수거날짜</label>
          <input type="text" readonly class="form-control"
                 name="reservation_date" id="reservation_date"
                 th:value="${paramDate}"/>
        </div>
      </div>

      <!-- 배송지 정보 -->
      <div class="addr">
        <p>배송지정보</p>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="addr"
                 id="order_addr_old" value="기존배송지" checked/>
          <label class="form-check-label" for="order_addr_old">기존배송지</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="addr"
                 id="order_addr_new" value="신규배송지"/>
          <label class="form-check-label" for="order_addr_new">신규배송지</label>
        </div>

        <div id="selectAddr_curAddr" class="mt-3">
          <label for="order_addr">주소</label>
          <input type="text" readonly class="form-control"
                 name="order_addr" id="order_addr"
                 th:value="${dto.addr}"/>
        </div>

        <div id="selectAddr_newAddr" class="mt-3" style="display:none;">
          <input type="text" id="postcode" placeholder="우편번호"
                 class="form-control" readonly/>
          <button type="button" class="btn btn-outline-primary my-2"
                  onclick="sample6_execDaumPostcode()">
            우편번호 찾기
          </button>
          <input type="text" id="address" placeholder="주소"
                 class="form-control" readonly/>
          <input type="text" id="detailAddress"
                 placeholder="상세주소" class="form-control"/>
          <input type="text" id="extraAddress"
                 placeholder="참고항목" class="form-control" readonly/>
          <input type="hidden" id="totalAddr"/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="request">요청사항</label>
        <textarea class="form-control" name="request" id="request"
                  rows="3" placeholder="요청사항을 직접 입력합니다.(최대 200자)"></textarea>
      </div>
    </div>

    <div class="mb-3 mt-4">
      <label class="form-label" for="creditEmail">결제 정보 이메일</label>
      <input type="email" class="form-control" id="creditEmail"
             name="username" placeholder="Laundry@naver.com"/>
    </div>

    <!-- 결제 수단 -->
    <div class="creditForm">
      <p>결제수단</p>
      <button class="btn btn-dark" type="button" onclick="requestPay()" style="border-radius:0;">
        카드결제
      </button>

      <!-- 숨겨진 파라미터들 -->
      <input type="hidden" name="count"   th:value="${param.count}"/>
      <input type="hidden" name="product" th:value="${param.product}"/>
      <input type="hidden" name="inum"    th:value="${param.inum}"/>
    </div>

  </div>
</form>

<div id="paramData"
     th:data-name="${paramName}"
     th:data-price="${paramPrice}"
     th:data-count="${paramCount}"
     th:data-date="${paramDate}"
     th:data-number="${paramNumber}">
</div>
<!-- 푸터 -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Daum postcode -->
<script th:src="@{http://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js}"></script>

<script th:inline="javascript">
  /*<![CDATA[*/
    // 주소 선택
    $(function () {
    // 주소 선택
    let oldAddrSelect = true;
    $('#selectAddr_newAddr').hide();
    $("input[name='addr']").change(function(){
      console.log('배송지 선택됨:', $(this).val()); // ← 추가
      if($(this).val()==='기존배송지'){
        oldAddrSelect = true;
        $('#selectAddr_newAddr').hide();
        $('#selectAddr_curAddr').show();
      } else {
        oldAddrSelect = false;
        $('#selectAddr_curAddr').hide();
        $('#selectAddr_newAddr').show();
      }
    });

    // 주문정보 화면 채우기
    let el = document.getElementById('paramData');
    let n = el.dataset.name.split('/').filter(Boolean);
    let p = el.dataset.price.split('/').filter(Boolean);
    let c = el.dataset.count.split('/').filter(Boolean);
    let d = el.dataset.date.split('/').filter(Boolean);
    let e = el.dataset.number.split('/').filter(Boolean);

    let tot = 0;
    let productName='', inumList='', countList='';
    let year = d[1], month = d[2], day = d[3].substring(0,2);
    let productDate = `${year}년 ${month}월 ${day}일`;
    for(let i=1; i<n.length; i++){
      tot += parseInt(p[i],10);
      productName += (i>1?', ':'') + n[i]+' '+c[i]+'개';
      inumList     += (i>1?', ':'') + e[i];
      countList    += (i>1?', ':'') + c[i];
    }
    $('#productcount').val(productName);
    $('#order_price').val(tot);
    $('#reservation_date').val(productDate);
    $('#count').val(countList);
    $('#product').val(productName);
    $('#inum').val(inumList);
    $('.datein').text(productDate+' 에 현장결제를 선택하셨습니다.');

    window.sample6_execDaumPostcode = function() {
      new daum.Postcode({
        oncomplete(data) {
          let addr = data.userSelectedType === 'R'
            ? data.roadAddress
            : data.jibunAddress;
          let extra = '';
          if (data.userSelectedType === 'R') {
            if (data.bname && /[동|로|가]$/.test(data.bname))
              extra += data.bname;
            if (data.buildingName && data.apartment === 'Y')
              extra += (extra ? `, ${data.buildingName}` : data.buildingName);
            if (extra) extra = ` (${extra})`;
          }
          $('#postcode').val(data.zonecode);
          $('#address').val(addr);
          $('#extraAddress').val(extra);
          $('#detailAddress').focus();
        }
      }).open();
    };
  });
  /*]]>*/
</script>

<script src="https://cdn.iamport.kr/js/iamport.payment-1.2.0.js"></script>
<script>
  function requestPay() {
    const IMP = window.IMP;
    IMP.init("imp57455816");

    let isOldAddr = $('#order_addr_old').is(":checked");

    if (!isOldAddr) {
      if (!$('#postcode').val() || !$('#address').val() || !$('#detailAddress').val()) {
        alert('배송지를 입력해주세요');
        return;
      }
      $('input[name="order_addr"]').val(
        $('#postcode').val() + '_' +
        $('#address').val() + '_' +
        $('#detailAddress').val() + '_' +
        $('#extraAddress').val()
      );
    }

    if (!$('#creditEmail').val()) {
      alert('이메일을 입력해주세요');
      return;
    }

    const merchantUid = 'order_' + new Date().getTime();

    IMP.request_pay({
      pg: "html5_inicis",
      pay_method: "card",
      merchant_uid: merchantUid,
      name: $('#product').val(),
      amount: $('#order_price').val(),
      buyer_email: $('#creditEmail').val(),
      buyer_name: $('#orderer').val(),
      buyer_addr: isOldAddr ? $('#order_addr').val() : $('#address').val(),
      buyer_postcode: isOldAddr ? "" : $('#postcode').val()
    }, function (rsp) {
      if (rsp.success) {
        $('#merchant_uid').val(merchantUid);
        $('#imp_uid').val(rsp.imp_uid);

        $.ajax({
          url: "/Reserve/cardPayment",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            impUid: rsp.imp_uid,
            merchantUid: rsp.merchant_uid
          }),
          success: function (res) {
            if (res.status === 'success') {
              document.getElementById('insertForm').submit();
            } else {
              alert('결제 검증 실패: ' + res.message);
            }
          }
        });
      } else {
        alert("결제 실패: " + rsp.error_msg);
      }
    });
  }
</script>
</body>
</html>
